<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Permanent+Marker&display=swap');

:root{
  --ink:#14122B;
  --paper:#FDF6E3;
  --canvas:#211A4C;
  --coral:#FF6B6B;
  --teal:#3EC6BE;
  --yellow:#FFD93D;
  --purple:#8C7CF0;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 20%, #2c2266 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, #2c2266 0%, transparent 45%),
    var(--canvas);
  font-family:'Patrick Hand', sans-serif;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
}

.deck{
  position:relative;
  width:min(94vw, 980px);
  height:min(78vh, 620px);
}

.slide{
  position:absolute;
  inset:0;
  background:var(--paper);
  border:6px solid var(--ink);
  border-radius:22px;
  box-shadow:10px 10px 0 var(--ink), 0 0 0 6px var(--paper) inset;
  padding:26px 34px 20px;
  display:none;
  flex-direction:column;
  transform:rotate(-0.4deg);
  overflow:hidden;
}
.slide.active{display:flex;}
.slide:nth-child(even){transform:rotate(0.4deg);}

.dots-bg{
  position:absolute;
  inset:0;
  background-image:radial-gradient(var(--ink) 1.4px, transparent 1.4px);
  background-size:16px 16px;
  opacity:0.06;
  pointer-events:none;
}

.page-tag{
  position:absolute;
  top:-16px;
  left:26px;
  background:var(--ink);
  color:var(--paper);
  font-family:'Permanent Marker', cursive;
  font-size:13px;
  padding:5px 14px;
  border-radius:20px;
  letter-spacing:1px;
  transform:rotate(-3deg);
  z-index:5;
}

.headline{
  font-family:'Bangers', cursive;
  font-size:clamp(28px,4.2vw,44px);
  letter-spacing:1px;
  color:var(--ink);
  margin:14px 0 2px;
  -webkit-text-stroke:0.6px var(--ink);
  z-index:2;
}
.headline .hl{
  background:linear-gradient(180deg, transparent 58%, var(--yellow) 58%);
  padding:0 4px;
}

.sub{
  font-size:17px;
  color:#4a4470;
  margin:0 0 8px;
  z-index:2;
}

.body{
  flex:1;
  display:flex;
  align-items:center;
  gap:22px;
  z-index:2;
  min-height:0;
}
.art{
  flex:0 0 44%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.art svg{width:100%;height:100%;max-height:280px;}

.notes{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
  justify-content:center;
}
.note-item{
  background:#fff;
  border:3px solid var(--ink);
  border-radius:12px;
  padding:10px 14px;
  font-size:17px;
  line-height:1.35;
  box-shadow:4px 4px 0 var(--ink);
  position:relative;
}
.note-item.coral{background:#FFE8E4;}
.note-item.teal{background:#E4FBF8;}
.note-item.yellow{background:#FFF7DA;}

.bubble{
  align-self:flex-start;
  margin-top:4px;
  font-family:'Permanent Marker', cursive;
  font-size:14px;
  color:#fff;
  background:var(--coral);
  padding:6px 14px;
  border-radius:16px;
  transform:rotate(-2deg);
  box-shadow:3px 3px 0 var(--ink);
}

.footer-strip{
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
  border-top:3px dashed var(--ink);
  padding-top:8px;
}
.brand{
  font-family:'Bangers', cursive;
  font-size:14px;
  color:#8b83b8;
  letter-spacing:2px;
}
.pagenum{
  font-family:'Permanent Marker', cursive;
  font-size:14px;
  color:var(--ink);
}

/* nav */
.nav{
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:22px;
  z-index:10;
}
.nav button{
  font-family:'Bangers', cursive;
  font-size:18px;
  letter-spacing:1px;
  background:var(--yellow);
  border:4px solid var(--ink);
  border-radius:12px;
  padding:8px 20px;
  cursor:pointer;
  color:var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s ease;
}
.nav button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
.nav button:disabled{opacity:0.35;cursor:not-allowed;}
.dotsnav{display:flex;gap:7px;}
.dotsnav span{
  width:9px;height:9px;border-radius:50%;
  background:#4a4470;opacity:0.4;cursor:pointer;
}
.dotsnav span.on{background:var(--yellow);opacity:1;}

@media (max-width:700px){
  .body{flex-direction:column;}
  .art{flex:0 0 40%;}
  .art svg{max-height:170px;}
}
</style>

// ---------- render ----------
const deck = document.getElementById('deck');
slides.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0?' active':'');
  div.innerHTML = slideShell(s.tag, s.h, s.sub, s.art, s.notes, s.bubble);
  deck.appendChild(div);
});

const dotsnav = document.getElementById('dotsnav');
slides.forEach((_,i)=>{
  const d = document.createElement('span');
  if(i===0) d.className='on';
  d.addEventListener('click',()=>go(i));
  dotsnav.appendChild(d);
});

let cur = 0;
const total = slides.length;
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active', i===cur));
  document.querySelectorAll('.dotsnav span').forEach((el,i)=>el.classList.toggle('on', i===cur));
  document.querySelectorAll('[data-num]').forEach((el)=>el.textContent = (cur+1)+' / '+total);
  document.getElementById('prevBtn').disabled = cur===0;
  document.getElementById('nextBtn').disabled = cur===total-1;
}
function go(i){ cur = Math.max(0, Math.min(total-1, i)); render(); }
document.getElementById('prevBtn').addEventListener('click',()=>go(cur-1));
document.getElementById('nextBtn').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
render();
</script>
